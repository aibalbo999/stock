x-stock-ai-app: &stock-ai-app
  build:
    context: .
  environment: &stock-ai-env
    DATABASE_URL: postgresql+psycopg://stock_ai:stock_ai_password@postgres:5432/stock_ai
    DATABASE_INIT_MODE: alembic
    REDIS_URL: redis://redis:6379/0
    USE_CHROMA: "true"
    CHROMA_API_URL: http://chroma:8000
    VECTOR_DB_PATH: /app/.chroma
    COMPANY_FILING_BROWSER_RENDER_ENABLED: "true"
    COMPANY_FILING_BROWSER_RENDER_URL: http://browserless:3000/content?token=stock_ai_browserless_token
    COMPANY_FILING_BROWSER_RENDER_TOKEN: stock_ai_browserless_token
    COMPANY_FILING_BROWSER_RENDER_CONCURRENCY: "4"
    NEO4J_URI: neo4j://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: stock_ai_neo4j_password
    NEO4J_DATABASE: neo4j
  volumes:
    - ./data:/app/data
    - ./reports:/app/reports
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    browserless:
      condition: service_healthy
    chroma:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    container_name: stock-ai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: stock-ai-postgres
    environment:
      POSTGRES_DB: stock_ai
      POSTGRES_USER: stock_ai
      POSTGRES_PASSWORD: stock_ai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_ai -d stock_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: stock-ai-neo4j
    environment:
      NEO4J_AUTH: neo4j/stock_ai_neo4j_password
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: stock-ai-browserless
    environment:
      TOKEN: stock_ai_browserless_token
      CONCURRENT: "4"
      TIMEOUT: "30000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/json/version?token=stock_ai_browserless_token', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: stock-ai-flaresolverr
    profiles: ["unlocker"]
    environment:
      LOG_LEVEL: info
      TZ: Asia/Taipei
    ports:
      - "8191:8191"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  chroma:
    image: chromadb/chroma:latest
    container_name: stock-ai-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3).getcode() == 200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery-worker:
    <<: *stock-ai-app
    container_name: stock-ai-celery-worker
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO", "--pool=solo"]

  celery-beat:
    <<: *stock-ai-app
    container_name: stock-ai-celery-beat
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/var/lib/celery/celerybeat-schedule",
      ]
    volumes:
      - ./data:/app/data
      - celerybeat_data:/var/lib/celery

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  celerybeat_data:
