x-stock-ai-app: &stock-ai-app
  build:
    context: .
  environment: &stock-ai-env
    DATABASE_URL: postgresql+psycopg://stock_ai:stock_ai_password@postgres:5432/stock_ai
    DATABASE_INIT_MODE: alembic
    REDIS_URL: redis://redis:6379/0
    USE_CHROMA: "true"
    CHROMA_API_URL: http://chroma:8000
    VECTOR_DB_PATH: /app/.chroma
    COMPANY_FILING_BROWSER_RENDER_ENABLED: "true"
    COMPANY_FILING_BROWSER_RENDER_PROVIDER: ${COMPANY_FILING_BROWSER_RENDER_PROVIDER:-browserless}
    COMPANY_FILING_BROWSER_RENDER_URL: ${COMPANY_FILING_BROWSER_RENDER_URL:-http://browserless:3000/content?token=stock_ai_browserless_token}
    COMPANY_FILING_BROWSER_RENDER_TOKEN: ${COMPANY_FILING_BROWSER_RENDER_TOKEN:-stock_ai_browserless_token}
    COMPANY_FILING_BROWSER_RENDER_CONCURRENCY: "4"
    COMPANY_FILING_USER_AGENTS: ${COMPANY_FILING_USER_AGENTS:-}
    COMPANY_FILING_PROXY_URLS: ${COMPANY_FILING_PROXY_URLS:-}
    COMPANY_FILING_STRUCTURED_API_PROVIDER: ${COMPANY_FILING_STRUCTURED_API_PROVIDER:-}
    COMPANY_FILING_STRUCTURED_API_URL: ${COMPANY_FILING_STRUCTURED_API_URL:-}
    COMPANY_FILING_STRUCTURED_API_TOKEN: ${COMPANY_FILING_STRUCTURED_API_TOKEN:-}
    COMPANY_FILING_STRUCTURED_API_TIMEOUT_SECONDS: ${COMPANY_FILING_STRUCTURED_API_TIMEOUT_SECONDS:-20}
    COMPANY_FILING_VISUAL_RAG_ENABLED: ${COMPANY_FILING_VISUAL_RAG_ENABLED:-true}
    COMPANY_FILING_VISUAL_RAG_MODE: ${COMPANY_FILING_VISUAL_RAG_MODE:-fallback}
    COMPANY_FILING_VISUAL_RAG_MODEL: ${COMPANY_FILING_VISUAL_RAG_MODEL:-gemini-3.5-flash}
    COMPANY_FILING_VISUAL_RAG_MAX_PAGES: ${COMPANY_FILING_VISUAL_RAG_MAX_PAGES:-2}
    COMPANY_FILING_VISUAL_RAG_DPI: ${COMPANY_FILING_VISUAL_RAG_DPI:-144}
    COMPANY_FILING_VISUAL_RAG_TIMEOUT_SECONDS: ${COMPANY_FILING_VISUAL_RAG_TIMEOUT_SECONDS:-60}
    MARKET_PRICE_PROVIDER_ORDER: ${MARKET_PRICE_PROVIDER_ORDER:-finmind,fugle}
    FINMIND_TOKEN: ${FINMIND_TOKEN:-}
    FUGLE_API_KEY: ${FUGLE_API_KEY:-}
    RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-google_genai}
    RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-gemini-embedding-2}
    RAG_EMBEDDING_OUTPUT_DIMENSIONALITY: ${RAG_EMBEDDING_OUTPUT_DIMENSIONALITY:-}
    RAG_INDEX_SCHEMA_VERSION: ${RAG_INDEX_SCHEMA_VERSION:-identity-v2}
    RAG_ALLOW_CHROMA_DEFAULT_EMBEDDING_FALLBACK: ${RAG_ALLOW_CHROMA_DEFAULT_EMBEDDING_FALLBACK:-false}
    RAG_HYBRID_SEARCH_ENABLED: ${RAG_HYBRID_SEARCH_ENABLED:-true}
    RAG_RERANKER_PROVIDER: ${RAG_RERANKER_PROVIDER:-auto}
    RAG_RERANKER_MODEL: ${RAG_RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
    RAG_LLM_RERANKER_ENABLED: ${RAG_LLM_RERANKER_ENABLED:-true}
    RAG_LLM_RERANKER_MAX_DOCUMENTS: ${RAG_LLM_RERANKER_MAX_DOCUMENTS:-8}
    LLM_PROVIDER: ${LLM_PROVIDER:-google_genai}
    PRIMARY_LLM_MODEL: ${PRIMARY_LLM_MODEL:-gemini-3.5-flash}
    LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemini-2.5-flash-lite}
    LLM_FALLBACK_MODELS: ${LLM_FALLBACK_MODELS:-gemini-2.5-flash,gemini-3.1-flash-lite,gemini-2.5-flash-lite,gemma-4-31b-it}
    GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    GOOGLE_API_KEYS: ${GOOGLE_API_KEYS:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    COHERE_API_KEY: ${COHERE_API_KEY:-}
    LLM_MAX_RETRIES_PER_KEY: ${LLM_MAX_RETRIES_PER_KEY:-1}
    LLM_MODEL_QUOTA_COOLDOWN_SECONDS: ${LLM_MODEL_QUOTA_COOLDOWN_SECONDS:-3600}
    LLM_QUOTA_HARD_ROUTING_ENABLED: ${LLM_QUOTA_HARD_ROUTING_ENABLED:-true}
    LLM_QUOTA_WINDOW_TIMEZONE: ${LLM_QUOTA_WINDOW_TIMEZONE:-America/Los_Angeles}
    LLM_MODEL_DAILY_REQUEST_BUDGETS: ${LLM_MODEL_DAILY_REQUEST_BUDGETS:-gemini-3.5-flash=250,gemini-2.5-flash=250,gemini-3.1-flash-lite=250,gemini-2.5-flash-lite=250,gemma-4-31b-it=14400}
    LLM_MODEL_DAILY_TOKEN_BUDGETS: ${LLM_MODEL_DAILY_TOKEN_BUDGETS:-}
    LLM_BASE_RETRY_DELAY_SECONDS: ${LLM_BASE_RETRY_DELAY_SECONDS:-0.5}
    LLM_MAX_RETRY_DELAY_SECONDS: ${LLM_MAX_RETRY_DELAY_SECONDS:-5.0}
    LLM_OBSERVABILITY_ENABLED: ${LLM_OBSERVABILITY_ENABLED:-true}
    LLM_OBSERVABILITY_PROVIDER: ${LLM_OBSERVABILITY_PROVIDER:-local}
    LLM_OBSERVABILITY_EXTERNAL_DISPATCH_ENABLED: ${LLM_OBSERVABILITY_EXTERNAL_DISPATCH_ENABLED:-true}
    LLM_OBSERVABILITY_PROJECT_NAME: ${LLM_OBSERVABILITY_PROJECT_NAME:-stock-analysis}
    LLM_OBSERVABILITY_EXPORT_TIMEOUT_SECONDS: ${LLM_OBSERVABILITY_EXPORT_TIMEOUT_SECONDS:-2.0}
    LLM_INPUT_COST_PER_1K_TOKENS_USD: ${LLM_INPUT_COST_PER_1K_TOKENS_USD:-0}
    LLM_OUTPUT_COST_PER_1K_TOKENS_USD: ${LLM_OUTPUT_COST_PER_1K_TOKENS_USD:-0}
    LLM_MODEL_COST_RATE_CARD_USD: ${LLM_MODEL_COST_RATE_CARD_USD:-}
    LLM_DAILY_COST_BUDGET_USD: ${LLM_DAILY_COST_BUDGET_USD:-0}
    LLM_COST_WARNING_RATIO: ${LLM_COST_WARNING_RATIO:-0.8}
    LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
    PHOENIX_ENDPOINT: ${PHOENIX_ENDPOINT:-}
    PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    TASK_OBSERVABILITY_STALE_MINUTES: ${TASK_OBSERVABILITY_STALE_MINUTES:-60}
    AUTO_FOLLOW_UP_ENABLED: ${AUTO_FOLLOW_UP_ENABLED:-true}
    AUTO_FOLLOW_UP_NEWS_LIMIT: ${AUTO_FOLLOW_UP_NEWS_LIMIT:-30}
    SYNC_REPORT_PRE_REFRESH_ENABLED: ${SYNC_REPORT_PRE_REFRESH_ENABLED:-false}
    SYNC_REPORT_QUALITY_RECOVERY_ENABLED: ${SYNC_REPORT_QUALITY_RECOVERY_ENABLED:-false}
    REPORT_QUALITY_AUTO_RECOVERY_ENABLED: ${REPORT_QUALITY_AUTO_RECOVERY_ENABLED:-true}
    WORKFLOW_ENGINE: ${WORKFLOW_ENGINE:-local}
    WORKFLOW_LOCAL_FALLBACK_ENABLED: ${WORKFLOW_LOCAL_FALLBACK_ENABLED:-true}
    PREFECT_API_URL: ${PREFECT_API_URL:-}
    TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-localhost:7233}
    TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-stock-analysis}
    TEMPORAL_WORKFLOW_NAME: ${TEMPORAL_WORKFLOW_NAME:-StockAnalysisPipeline}
    TEMPORAL_UI_URL: ${TEMPORAL_UI_URL:-}
    TEMPORAL_TIMEOUT_SECONDS: ${TEMPORAL_TIMEOUT_SECONDS:-15}
    AIRFLOW_API_URL: ${AIRFLOW_API_URL:-}
    AIRFLOW_DAG_ID: ${AIRFLOW_DAG_ID:-stock_analysis_pipeline}
    AIRFLOW_API_TOKEN: ${AIRFLOW_API_TOKEN:-}
    AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-}
    AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-}
    AIRFLOW_TIMEOUT_SECONDS: ${AIRFLOW_TIMEOUT_SECONDS:-15}
    NEO4J_URI: ${COMPOSE_NEO4J_URI:-neo4j://neo4j:7687}
    NEO4J_USER: ${COMPOSE_NEO4J_USER:-neo4j}
    NEO4J_PASSWORD: ${COMPOSE_NEO4J_PASSWORD:-stock_ai_neo4j_password}
    NEO4J_DATABASE: ${COMPOSE_NEO4J_DATABASE:-neo4j}
  volumes:
    - ./data:/app/data
    - ./reports:/app/reports
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    browserless:
      condition: service_healthy
    chroma:
      condition: service_healthy

services:
  redis:
    image: redis:7-alpine
    container_name: stock-ai-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: stock-ai-postgres
    environment:
      POSTGRES_DB: stock_ai
      POSTGRES_USER: stock_ai
      POSTGRES_PASSWORD: stock_ai_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_ai -d stock_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: stock-ai-neo4j
    environment:
      NEO4J_AUTH: ${COMPOSE_NEO4J_AUTH:-neo4j/stock_ai_neo4j_password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: stock-ai-browserless
    environment:
      TOKEN: stock_ai_browserless_token
      CONCURRENT: "4"
      TIMEOUT: "30000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/json/version?token=stock_ai_browserless_token', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: stock-ai-flaresolverr
    profiles: ["unlocker"]
    environment:
      LOG_LEVEL: info
      TZ: Asia/Taipei
    ports:
      - "8191:8191"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8191/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  chroma:
    image: chromadb/chroma:latest
    container_name: stock-ai-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/8000; printf \"GET /api/v2/heartbeat HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3; read -r status <&3; [[ \"$$status\" == *\" 200 \"* ]]'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  celery-worker:
    <<: *stock-ai-app
    container_name: stock-ai-celery-worker
    command: ["celery", "-A", "app.tasks.celery_app.celery_app", "worker", "--loglevel=INFO", "--pool=solo"]

  celery-beat:
    <<: *stock-ai-app
    container_name: stock-ai-celery-beat
    command:
      [
        "celery",
        "-A",
        "app.tasks.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/var/lib/celery/celerybeat-schedule",
      ]
    volumes:
      - ./data:/app/data
      - celerybeat_data:/var/lib/celery

volumes:
  redis_data:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  chroma_data:
  celerybeat_data:
