[project]
name = "taiwan-ai-supply-chain-rag"
version = "0.1.0"
description = "AI industry-chain Taiwan equities analysis and automated report generation MVP."
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "alembic>=1.13.3",
  "celery>=5.4.0",
  "chromadb>=0.5.20",
  "cryptography>=42.0.0",
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "httpx>=0.27.2",
  "jinja2>=3.1.4",
  "litellm>=1.70.0",
  "pandas>=2.2.3",
  "pdfplumber>=0.11.4",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.6.1",
  "pypdf>=5.0.0",
  "python-dotenv>=1.0.1",
  "redis>=5.2.0",
  "requests>=2.32.3",
  "sqlalchemy>=2.0.36",
  "streamlit>=1.40.0",
  "uvicorn>=0.32.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pyyaml>=6.0.0",
  "ruff>=0.7.4",
  "detect-secrets>=1.5.0"
]
rag = [
  "sentence-transformers>=3.0.0",
  "openai>=1.40.0",
  "google-generativeai>=0.8.0",
  "cohere>=5.0.0"
]
pdf = [
  "unstructured[pdf]>=0.15.0"
]
visual = [
  "pymupdf>=1.24.0"
]
browser = [
  "playwright>=1.45.0"
]
workflow = [
  "prefect>=3.0.0",
  "temporalio>=1.6.0"
]
graph = [
  "neo4j>=5.20.0"
]
observability = [
  "langsmith>=0.1.0",
  "arize-phoenix-otel>=0.16.0",
  "opentelemetry-api>=1.25.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  # FastAPI's TestClient still imports Starlette's httpx-backed compatibility layer.
  'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.:Warning',
  # PyMuPDF 1.27 emits SWIG import deprecations on Python 3.13; Visual RAG behavior is tested separately.
  'ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning',
  'ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning',
  'ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning',
]

[tool.security_scan]
command = "python scripts/security_scan.py"

[tool.ruff]
line-length = 100
target-version = "py311"
